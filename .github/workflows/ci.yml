name: CI

# Pull requests are checked by the pull_request run, so pushes only need checking on master.
on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Typecheck, lint, and format
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # Reads the version from `packageManager` in package.json.
            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js v24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            # `pnpm lint` and `pnpm format` rewrite files; CI only checks.
            - name: Lint
              run: pnpm exec oxlint --deny-warnings

            - name: Check formatting
              run: pnpm exec oxfmt --check

    test:
        name: Tests
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            # The score service's MariaDB tests fail instead of being skipped when MariaDB is missing.
            REQUIRE_MARIADB: "1"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js v24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            # Tests start their own throwaway `mariadbd` on a free port; the system service is not used.
            - name: Install MariaDB
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mariadb-server
                  sudo systemctl stop mariadb || true

            # mongodb-memory-server downloads `mongod` on first use.
            - name: Cache MongoDB binaries
              uses: actions/cache@v6
              with:
                  path: ~/.cache/mongodb-binaries
                  key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: mongodb-binaries-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Runs one package at a time; `CI` (set by GitHub) limits vitest to one worker.
            - name: Unit and integration tests
              run: pnpm test

            # Builds each app (and a processor snapshot) before testing it end to end.
            - name: End-to-end tests
              run: pnpm test:e2e
